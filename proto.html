<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BVM Box Prototype</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root { --bg: #1d2330; --panel: #252c3b; --line: #374156; --fg: #e6ebf5; --dim: #9aa6bd; --accent: #4c8dff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px "Microsoft YaHei UI", "Segoe UI", sans-serif; overflow: hidden; }
    #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 5px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; overflow-x: auto; }
    #bar button, #bar select { height: 30px; padding: 0 9px; border: 1px solid var(--line); background: #2d3547; color: var(--fg); border-radius: 6px; cursor: pointer; font: inherit; white-space: nowrap; flex: none; }
    #bar button:hover { border-color: var(--accent); }
    #bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    #bar button kbd { font: 11px Consolas, monospace; color: var(--dim); margin-left: 4px; }
    #bar button.on kbd { color: #dfe8ff; }
    #bar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 3px; flex: none; }
    #bar .add { cursor: grab; }
    #view { position: fixed; top: 44px; left: 0; right: 0; bottom: 26px; }
    #status { position: fixed; left: 0; right: 0; bottom: 0; height: 26px; line-height: 26px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status b { color: var(--fg); font-weight: 600; }
    #status .warn { color: #ffb84c; }
    #props { position: fixed; right: 10px; top: 54px; width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 64px 1fr; gap: 6px 8px; align-items: center; z-index: 2; }
    #props[hidden] { display: none; }
    #props input[type=number], #props select { width: 100%; height: 26px; background: #1b2130; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font: inherit; }
    #props label { color: var(--dim); }
    #props .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--dim); }
    #props .row label { display: flex; align-items: center; gap: 3px; }
    #props .row select, #props .row button { width: auto; height: 24px; background: #1b2130; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; font: inherit; cursor: pointer; }
    #props { max-height: calc(100vh - 100px); overflow-y: auto; }
    #props .title { grid-column: 1 / -1; font-weight: 600; }
    #palette { position: fixed; top: 48px; width: 260px; max-height: 70vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; z-index: 4; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    #palette[hidden] { display: none; }
    #palette .cat { color: var(--dim); padding: 6px 6px 2px; font-size: 12px; }
    #palette .item { padding: 6px 8px; border-radius: 5px; cursor: grab; }
    #palette .item:hover { background: #33405a; }
    #marquee { position: fixed; border: 1px solid var(--accent); background: rgba(76,141,255,.12); pointer-events: none; z-index: 2; }
    #marquee[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="bar">
    <button class="add" data-add="normal" title="点击放到视图中心；拖进视图放置（拖动时自动吸附）">平路</button>
    <button class="add" data-add="sink">凹路</button>
    <button class="add" data-add="ribbon">细边框凹路</button>
    <button class="add" data-add="transition">平凹转换</button>
    <button class="add" data-add="transition-narrow">窄转换</button>
    <button class="add" data-add="start" title="起点（四火），全图一个">起点</button>
    <button class="add" data-add="check" title="小节盘点（两火），按放置顺序编小节号">小节</button>
    <button class="add" data-add="rail" title="钢轨：拖进视图放置（按鼠标下那条路的方向），Ctrl 拖动拉长末段，属性面板里加弯道 / 坡 / 螺旋">钢轨</button>
    <button id="mods" title="机关与装饰：拖进视图放置">机关 ▾</button>
    <div class="sep"></div>
    <button id="split" title="切分：点路面在鼠标处切成两段，Tab 换方向（K）">切分<kbd>K</kbd></button>
    <button id="merge" title="合并选中的路面（Ctrl+J）">合并<kbd>^J</kbd></button>
    <button id="group" title="把选中的东西绑定成一个整体（Ctrl+G）">绑定<kbd>^G</kbd></button>
    <button id="ungroup" title="解除绑定（Ctrl+Shift+G）">解绑</button>
    <button id="dup" title="复制选中的东西，跟着鼠标走，点击放下（Ctrl+D）">复制<kbd>^D</kbd></button>
    <button id="rot" title="旋转 90°（R）">旋转<kbd>R</kbd></button>
    <button id="del" title="删除（X / Delete）">删除<kbd>X</kbd></button>
    <div class="sep"></div>
    <button id="grid" title="格栅：开启时位置和尺寸吸附到步长 1（G）">格栅<kbd>G</kbd></button>
    <button id="align" title="自动对齐：移动时边、中线、顶面靠近其它元素就对齐，并画出辅助面（S）">对齐<kbd>S</kbd></button>
    <div class="sep"></div>
    <button id="view-mode" title="机关显示成模型还是 BBP 占位符">机关模型</button>
    <button id="wire" title="显示内部切分（调试用）">切分线</button>
    <select id="scene"></select>
    <div class="sep"></div>
    <button id="open" title="打开 .bvmbox 工程">打开</button>
    <button id="save" title="保存 .bvmbox 工程（Ctrl+S）">保存</button>
    <button id="export" class="on" title="在浏览器里生成 .nmo，放进 Ballance 就能玩">导出 NMO</button>
    <input type="file" id="file" accept=".bvmbox,.json" hidden />
  </div>
  <div id="palette" hidden></div>
  <div id="view"></div>
  <div id="marquee" hidden></div>
  <div id="props" hidden></div>
  <div id="status"></div>
  <script type="module" src="/src/box/proto.ts"></script>
</body>
</html>
