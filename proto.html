<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BVM Box Prototype</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root { --bg: #1d2330; --panel: #252c3b; --line: #374156; --fg: #e6ebf5; --dim: #9aa6bd; --accent: #4c8dff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px "Microsoft YaHei UI", "Segoe UI", sans-serif; overflow: hidden; }
    #bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
    #bar button, #bar select { height: 30px; padding: 0 10px; border: 1px solid var(--line); background: #2d3547; color: var(--fg); border-radius: 6px; cursor: pointer; font: inherit; }
    #bar button:hover { border-color: var(--accent); }
    #bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    #bar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
    #bar .add { cursor: grab; }
    #view { position: fixed; top: 44px; left: 0; right: 0; bottom: 26px; }
    #status { position: fixed; left: 0; right: 0; bottom: 0; height: 26px; line-height: 26px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); }
    #props { position: fixed; right: 10px; top: 54px; width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 64px 1fr; gap: 6px 8px; align-items: center; }
    #props[hidden] { display: none; }
    #props input, #props select { width: 100%; height: 26px; background: #1b2130; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font: inherit; }
    #props label { color: var(--dim); }
    #props .row { grid-column: 1 / -1; display: flex; gap: 8px; color: var(--dim); }
  </style>
</head>
<body>
  <div id="bar">
    <button class="add" data-add="normal" title="点击放到视图中心；拖进视图放置（拖动时自动吸附顶点）">平路</button>
    <button class="add" data-add="sink">凹路</button>
    <button class="add" data-add="ribbon">细边框凹路</button>
    <button class="add" data-add="transition">平凹转换</button>
    <button class="add" data-add="transition-narrow">窄转换</button>
    <div class="sep"></div>
    <button id="rot" title="旋转 90°（R）">旋转</button>
    <button id="del" title="删除（Delete）">删除</button>
    <div class="sep"></div>
    <button id="grid" title="格栅：开启时位置和尺寸吸附到步长 1（G）">格栅</button>
    <button id="wire" title="显示内部切分（调试用）">切分线</button>
    <div class="sep"></div>
    <select id="scene"></select>
  </div>
  <div id="view"></div>
  <div id="props" hidden></div>
  <div id="status"></div>
  <script type="module" src="/src/box/proto.ts"></script>
</body>
</html>
