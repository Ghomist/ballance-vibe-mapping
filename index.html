<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ballance Vibe Mapping</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="toolbar">
    <strong class="brand">BVM</strong>
    <div class="group" id="tools">
      <button data-tool="edit" title="1">编辑</button>
      <button data-tool="cut" title="2">分隔</button>
    </div>
    <label class="group">步长
      <select id="step">
        <option value="5" selected>5</option>
        <option value="2.5">2.5</option>
        <option value="1.25">1.25</option>
      </select>
    </label>
    <div class="group">
      <button id="undo" title="Ctrl+Z">撤销</button>
      <button id="redo" title="Ctrl+Y">重做</button>
    </div>
    <div class="group">
      <button id="new">新建</button>
      <button id="open">打开</button>
      <button id="save">保存</button>
      <input type="file" id="file" accept=".bvm,.json" hidden />
    </div>
  </header>
  <main id="viewport"></main>
  <footer id="status"></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
