<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ballance Vibe Mapping</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="toolbar">
    <strong class="brand">BVM</strong>
    <div class="group" id="tools">
      <button data-tool="edit" title="1">路块</button>
      <button data-tool="rail" title="2">钢轨</button>
      <button data-tool="guard" title="3">护栏</button>
    </div>
    <div class="group">
      <button id="grid" title="G：切换">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 4.5h12M1 9.5h12M4.5 1v12M9.5 1v12"/></svg>
        格栅
      </button>
      <button id="settings" title="全图设置">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="2.2"/><path d="M7 1v1.8M7 11.2V13M1 7h1.8M11.2 7H13M2.8 2.8l1.3 1.3M9.9 9.9l1.3 1.3M2.8 11.2l1.3-1.3M9.9 4.1l1.3-1.3"/></svg>
        设置
      </button>
      <button id="snap" title="S：切换">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 1.5v6a4 4 0 0 0 8 0v-6M3 4h2.4M8.6 4H11M5.4 1.5v6a1.6 1.6 0 0 0 3.2 0v-6"/></svg>
        自动对齐
      </button>
    </div>
    <div class="group">
      <button id="undo" title="Ctrl+Z">撤销</button>
      <button id="redo" title="Ctrl+Y">重做</button>
    </div>
    <div class="group">
      <button id="new">新建</button>
      <button id="open">打开</button>
      <button id="save">保存</button>
      <span class="dropdown">
        <button id="export">导出 ▾</button>
        <div class="dropdown-menu" id="export-menu">
          <button data-format="nmo"><span>导出 NMO</span><small>本机 Blender + BBP 生成</small></button>
          <button data-format="blend"><span>导出 Blender 文件</span><small>.blend，可继续手工修改</small></button>
          <button data-format="json"><span>导出场景描述</span><small>JSON，配合 scripts/blender/build_scene.py</small></button>
        </div>
      </span>
      <input type="file" id="file" accept=".bvm,.json" hidden />
    </div>
  </header>
  <main id="viewport">
    <aside id="palette"></aside>
    <div id="settings-panel" class="settings-panel" hidden></div>
  </main>
  <footer id="statusbar"><div id="hints"></div><div id="status"></div></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
