<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ballance Vibe Mapping</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="toolbar">
    <strong class="brand">BVM</strong>
    <div class="group" id="tools">
      <button data-tool="edit" title="1">编辑</button>
      <button data-tool="cut" title="2">分隔</button>
      <button data-tool="rail" title="3">钢轨</button>
    </div>
    <div class="group">
      <button id="grid" title="G：切换；按住 Ctrl 临时切换">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 4.5h12M1 9.5h12M4.5 1v12M9.5 1v12"/></svg>
        格栅
      </button>
    </div>
    <div class="group">
      <button id="undo" title="Ctrl+Z">撤销</button>
      <button id="redo" title="Ctrl+Y">重做</button>
    </div>
    <div class="group">
      <button id="new">新建</button>
      <button id="open">打开</button>
      <button id="save">保存</button>
      <input type="file" id="file" accept=".bvm,.json" hidden />
    </div>
  </header>
  <main id="viewport"></main>
  <footer id="status"></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
